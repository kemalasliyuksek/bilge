name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reuses these jobs so a release is built exactly like
  # every CI run.
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries and archive names, e.g. v0.1.0
        type: string
        required: true

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  WAILS_VERSION: v2.17.0
  GOLANGCI_LINT_VERSION: v2.15.0

# Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check
        run: just check

      - name: Validate the Linux desktop entry
        run: desktop-file-validate build/linux/bilge.desktop

      # The runner ships a Docker Engine; the integration test only reads it.
      - name: Integration test against the runner's Docker Engine
        run: just test-integration

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # CI builds are named after the commit; releases pass the tag.
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${INPUT_VERSION:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # The Windows file version and the macOS bundle version come from
      # wails.json and must be plain MAJOR.MINOR.PATCH, so a tag's pre-release
      # suffix is dropped and untagged builds stay 0.0.0.
      - name: Stamp the product version
        shell: bash
        run: |
          product="0.0.0"
          if [[ "$VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then product="${BASH_REMATCH[1]}"; fi
          node -e 'const fs = require("fs"); const j = JSON.parse(fs.readFileSync("wails.json")); j.info.productVersion = process.argv[1]; fs.writeFileSync("wails.json", JSON.stringify(j, null, 2) + "\n");' "$product"
          echo "product version: $product"

      # Called directly rather than through just: the justfile uses sh, which
      # is not a given on Windows runners. macOS builds a universal binary so
      # one download runs on both Apple silicon and Intel Macs.
      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) args=(-tags webkit2_41) ;;
            macOS) args=(-platform darwin/universal) ;;
            *) args=() ;;
          esac
          wails build -clean "${args[@]}" -ldflags "-X main.version=$VERSION"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp LICENSE README.md build/linux/bilge.desktop build/linux/bilge.png build/bin/
          tar -czf "dist/bilge-$VERSION-linux-amd64.tar.gz" -C build/bin \
            bilge bilge.desktop bilge.png LICENSE README.md

      # ditto keeps the bundle's symlinks and extended attributes, which a
      # plain zip would break.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/bilge.app "dist/bilge-$VERSION-macos-universal.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item LICENSE, README.md build/bin/
          Compress-Archive -Path build/bin/* -DestinationPath "dist/bilge-$env:VERSION-windows-amd64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilge-${{ runner.os }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
