name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag ends up in file names and the version string, so only accept
  # vMAJOR.MINOR.PATCH with an optional pre-release suffix.
  tag:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

  # The same quality gate and builds as every CI run, stamped with the tag.
  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Draft release
    needs: ci
    runs-on: ubuntu-24.04
    # The only job that may write: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bilge-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # A draft: nothing is public until a maintainer reviews it and presses
      # Publish on GitHub.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "bilge $TAG" --generate-notes
